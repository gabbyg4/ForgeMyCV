<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ForgeMyCV{% endblock %}</title>
    <meta name="description" content="{% block description %}Turn your experience into a polished, ATS-friendly CV and a matching cover letter in minutes.{% endblock %}">
    <meta name="theme-color" content="#1f4e79">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e79'/%3E%3Cpath d='M10 8h12v4h-8v3h7v4h-7v5h-4z' fill='%23fff'/%3E%3Ccircle cx='24' cy='22' r='2.5' fill='%23f59e0b'/%3E%3C/svg%3E">
    <style nonce="{{ csp_nonce() }}">
        :root {
            --accent: #1f4e79; --accent-dark: #163a5c; --accent-soft: #e8f0f8;
            --spark: #f59e0b; --text: #1f2328; --muted: #57606a; --border: #d0d7de;
            --bg: #f6f8fa; --surface: #fff; --danger: #cf222e; --danger-soft: #ffebe9;
            --radius: 8px; --shadow: 0 1px 3px rgba(31, 35, 40, .08), 0 8px 24px rgba(31, 35, 40, .06);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               color: var(--text); background: var(--bg); line-height: 1.5;
               display: flex; flex-direction: column; min-height: 100vh; }
        a { color: var(--accent); }
        main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 32px 16px 56px; }
        main.wide { max-width: 1100px; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Site chrome */
        .nav { background: var(--surface); border-bottom: 1px solid var(--border); }
        .nav-inner { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex;
                     align-items: center; justify-content: space-between; gap: 16px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem;
                 color: var(--accent); text-decoration: none; }
        .brand svg { flex: none; }
        .site-footer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted);
                       font-size: .875rem; }
        .site-footer .nav-inner { padding: 20px 16px; flex-wrap: wrap; }

        /* Shared components */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                padding: 24px; }
        .page-head { margin-bottom: 24px; }
        .page-head h1 { margin: 0; font-size: 1.75rem; }
        .page-head p { margin: 4px 0 0; color: var(--muted); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px;
               font: inherit; font-weight: 600; line-height: 1.25; border-radius: 6px; border: 1px solid var(--accent);
               background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
        .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .btn.secondary { background: var(--surface); color: var(--accent); border-color: var(--accent); }
        .btn.secondary:hover { background: var(--accent-soft); }
        .btn.small { padding: 7px 14px; font-size: .95rem; }
        .btn.large { padding: 14px 24px; font-size: 1.05rem; }
        .btn:disabled { opacity: .6; cursor: progress; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .alert { background: var(--danger-soft); border: 1px solid #ff8182; border-radius: 6px;
                 padding: 12px 16px; margin-bottom: 16px; }
        .alert ul { margin: 6px 0 0; padding-left: 20px; }
        [hidden] { display: none !important; }

        /* Forms */
        fieldset { border: 0; padding: 0; margin: 0 0 28px; min-width: 0; }
        legend { font-weight: 600; font-size: 1.1rem; margin-bottom: 12px; padding: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        .hint { font-weight: 400; color: var(--muted); font-size: .875rem; }
        input, textarea { width: 100%; padding: 8px 10px; font: inherit; color: inherit;
                          border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        [aria-invalid="true"] { border-color: var(--danger); background: #fffafa; }
        .field-error { color: var(--danger); font-size: .875rem; margin: 4px 0 0; }
        .req { color: var(--danger); }
        .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
        .check input { width: auto; margin: 0; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            main { padding-top: 24px; }
        }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
<header class="nav no-print">
    <div class="nav-inner">
        <a class="brand" href="{{ url_for('index') }}" aria-label="ForgeMyCV home">
            <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="7" fill="#1f4e79"/>
                <path d="M10 8h12v4h-8v3h7v4h-7v5h-4z" fill="#fff"/>
                <circle cx="24" cy="22" r="2.5" fill="#f59e0b"/>
            </svg>
            ForgeMyCV
        </a>
        {% block nav_action %}
        <a class="btn small" href="{{ url_for('form') }}">Build my CV</a>
        {% endblock %}
    </div>
</header>

<main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer no-print">
    <div class="nav-inner">
        <span>&copy; ForgeMyCV</span>
        <span>Your details are sent to OpenAI to write your documents and are never stored by ForgeMyCV.</span>
    </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
