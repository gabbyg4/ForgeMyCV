<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ForgeMyCV{% endblock %}</title>
    <style>
        :root { --accent: #1f4e79; --border: #d0d7de; --muted: #57606a; --bg: #f6f8fa; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               color: #1f2328; background: var(--bg); line-height: 1.5; }
        main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
        header.site { margin-bottom: 24px; }
        header.site h1 { margin: 0; color: var(--accent); }
        header.site p { margin: 4px 0 0; color: var(--muted); }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
        fieldset { border: 0; padding: 0; margin: 0 0 24px; }
        legend { font-weight: 600; font-size: 1.1rem; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        .hint { font-weight: 400; color: var(--muted); font-size: .875rem; }
        input, textarea { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid var(--border);
                          border-radius: 6px; background: #fff; }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        .req { color: #cf222e; }
        .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
        .check input { width: auto; margin: 0; }
        [hidden] { display: none !important; }
        .btn { display: inline-block; padding: 10px 18px; font: inherit; font-weight: 600; border-radius: 6px;
               border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
               text-decoration: none; }
        .btn.secondary { background: #fff; color: var(--accent); }
        .btn:disabled { opacity: .6; cursor: progress; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .errors { background: #ffebe9; border: 1px solid #ff8182; border-radius: 6px; padding: 12px 16px;
                  margin-bottom: 16px; }
        .errors ul { margin: 0; padding-left: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
<main>
    <header class="site no-print">
        <h1>ForgeMyCV</h1>
        <p>Turn your experience into a polished, tailored CV and cover letter.</p>
    </header>
    {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
