
<!DOCTYPE html>
<html>
<head>
    <title>ForgeMyCV - Generate Your CV</title>
</head>
<body>
    <h1>ForgeMyCV</h1>
    <form action="/generate" method="post">
        <label>Full Name:</label><br><input type="text" name="fullName"><br>
        <label>Job Title:</label><br><input type="text" name="jobTitle"><br>
        <label>Experience Summary:</label><br><textarea name="experience"></textarea><br>
        <label>Skills (comma-separated):</label><br><input type="text" name="skills"><br>
        <label>Job Description:</label><br><textarea name="jobDescription"></textarea><br>
        <input type="submit" value="Generate CV & Cover Letter">
    </form>
</body>
</html>
